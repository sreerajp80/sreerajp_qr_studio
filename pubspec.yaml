name: sreerajp_qr_studio
description: A privacy-first QR/barcode scanner with link safety checks, tamper detection, StegoQR, AR CodeVision, and offline smart tools
version: 4.1.2+36

environment:
  sdk: '>=3.13.5 <4.0.0'
  flutter: '>=3.47.6'

dependencies:
  flutter:
    sdk: flutter

  # Localization (ARB string files -> AppLocalizations)
  flutter_localizations:
    sdk: flutter
  intl: any

  # QR/Barcode scanning and optical rendering
  qr_flutter: ^4.1.0
  qr: ^3.0.2
  barcode: ^2.2.9

  # URL verification and HTTP requests
  http: ^1.6.0
  url_launcher: ^6.3.2

  # Clipboard functionality - using Flutter's built-in API (no package needed)

  # Sharing functionality
  share_plus: ^13.3.1

  # Permissions
  permission_handler: ">=12.0.1 <14.0.0"

  # GPS location for CodeForge geo preset
  geolocator: ^14.0.2

  # State management
  provider: ^6.1.5

  # Material and Cupertino widgets + localization delegates (Flutter >= 3.47)
  material_ui: ^1.6.0
  cupertino_ui: ^1.1.2

  # Theme and Material You
  dynamic_color: ^2.1.0

  # Package info for version reading
  package_info_plus: ^10.2.2

  flutter_secure_storage: ^10.0.0  # For secure, encrypted storage of API key
  shared_preferences: ^2.5.6

  # Biometrics and Encryption for StegoQR
  local_auth: ^2.3.0
  flutter_plugin_android_lifecycle: ^2.0.24
  encrypt: ^5.0.3
  pointycastle: ^3.9.1

  # Database & File storage
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0
  crypto: ^3.0.6

  # PDF report generation
  pdf: ^3.11.1

  # Gallery Image & PDF scanning and system share sheet target
  image_picker: ^1.1.2
  file_picker: ^13.1.0
  pdfx: ^2.11.0
  receive_sharing_intent: ^1.8.1
  camera: ^0.12.1
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/config/
    - assets/licenses/

  # App icon configuration will be handled separately for each platform
