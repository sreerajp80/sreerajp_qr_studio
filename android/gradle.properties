org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
kotlin.incremental=false
org.gradle.caching=true
org.gradle.parallel=true
# Built-in Kotlin (AGP 9): AGP compiles Kotlin; the app does not apply kotlin-android.
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Split APKs (--split-per-abi) keep the pubspec.yaml build number as their versionCode, the
# same as the App Bundle. Without this, Flutter adds 1000/2000/4000 per ABI, and a phone with a
# direct APK then never gets Play updates (see docs/release_process.md section 12).
force-version-code-ignoring-abi=true
