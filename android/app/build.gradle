plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keyProperties = new Properties()
def keyPropertiesFile = rootProject.file('key.properties')
if (keyPropertiesFile.exists()) {
    keyPropertiesFile.withReader('UTF-8') { reader ->
        keyProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new RuntimeException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def isWindowsHost = System.getProperty("os.name").toLowerCase().startsWith("windows")
def dartExecutable = new File(
    flutterRoot,
    isWindowsHost ? "bin\\dart.bat" : "bin/dart"
)
def projectRootDir = rootProject.projectDir.parentFile

// Gradle 9 removed project.exec; ExecOperations is the supported replacement.
interface InjectedExecOps {
    @javax.inject.Inject
    ExecOperations getExecOps()
}
def execOps = project.objects.newInstance(InjectedExecOps).execOps

def generateBuildMetadata = tasks.register("generateBuildMetadata") {
    group = "build setup"
    description = "Generates About-screen build metadata before Android builds."

    inputs.file(new File(projectRootDir, "pubspec.yaml"))
    inputs.file(new File(projectRootDir, "tool/generate_app_version.dart"))
    inputs.file(new File(projectRootDir, "tool/generate_build_date.dart"))
    inputs.property("metadataBuildDate", java.time.LocalDate.now().toString())
    outputs.file(new File(projectRootDir, "lib/core/constants/app_version.g.dart"))
    outputs.file(new File(projectRootDir, "lib/core/constants/build_date.g.dart"))

    doLast {
        if (!dartExecutable.exists()) {
            throw new RuntimeException(
                "Could not find Dart executable at ${dartExecutable.absolutePath}. " +
                "Check android\\local.properties flutter.sdk or FLUTTER_ROOT."
            )
        }

        execOps.exec {
            workingDir = projectRootDir
            commandLine dartExecutable.absolutePath, "run", "tool/generate_app_version.dart"
        }
        execOps.exec {
            workingDir = projectRootDir
            commandLine dartExecutable.absolutePath, "run", "tool/generate_build_date.dart"
        }
    }
}

tasks.named("preBuild") {
    dependsOn(generateBuildMetadata)
}

tasks.matching { task ->
    task.name.startsWith("compileFlutterBuild")
}.configureEach {
    dependsOn(generateBuildMetadata)
}

android {
    namespace = "in.sreerajp.qr_studio"
    compileSdk = 37
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    signingConfigs {
        release {
            keyAlias = keyProperties['keyAlias']
            keyPassword = keyProperties['keyPassword']
            storeFile = keyProperties['storeFile'] ? file(keyProperties['storeFile']) : null
            storePassword = keyProperties['storePassword']
        }
    }

    defaultConfig {
        applicationId = "in.sreerajp.qr_studio"
        minSdk = 24
        targetSdk = 36
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName

        // Our own barcode decoder (native/): build only the ABIs Flutter ships.
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
                abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path = file("../../native/CMakeLists.txt")
            version = "3.22.1"
        }
    }

    flavorDimensions = ["environment"]

    productFlavors {
        dev {
            dimension "environment"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
        }
        prod {
            dimension "environment"
        }
    }

    buildTypes {
        release {
            // With android/key.properties: the release key. Without it, only
            // dev release builds (never shipped) fall back to the debug key;
            // prod release tasks are stopped by the check below.
            signingConfig = keyPropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
        }
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = '../..'
}

// A prod release must be signed with the release key, never the debug key
// (docs/release_process.md §7). Fail early when android/key.properties is missing.
gradle.taskGraph.whenReady { graph ->
    def prodRelease = graph.allTasks.any { task ->
        task.project == project && task.name ==~ /(assemble|bundle|package)ProdRelease/
    }
    if (prodRelease && !keyPropertiesFile.exists()) {
        throw new GradleException(
            "android/key.properties is missing - prod release builds must be signed " +
            "with the release key (docs/release_process.md section 7)."
        )
    }
}
